services:
  # ============================================================================
  # Smart Sales Forecasting System - Backend API Service (Render Free Tier)
  # Free deployment architecture:
  # GitHub -> Render Free FastAPI backend -> Supabase PostgreSQL -> Vercel Frontend
  # ============================================================================
  - type: web
    name: smart-sales-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.10
      # External Supabase PostgreSQL connection string (supplied via Render Dashboard)
      - key: DATABASE_URL
        sync: false
      # Platform-managed persistent secret provisioning:
      # Render generates a secure 256-bit cryptographic string ONCE at initial service
      # provisioning time and persists it in Render's environment variable store.
      # The persistent value is injected as $SECRET_KEY into the application environment.
      # The FastAPI application NEVER generates secrets at runtime and strictly validates
      # that this environment variable is present and >= 16 characters on startup.
      - key: SECRET_KEY
        generateValue: true
      # Google Gemini API key for grounded narrative intelligence & recommendations
      - key: GEMINI_API_KEY
        sync: false
      # Vercel frontend URL (e.g. https://your-project.vercel.app)
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
